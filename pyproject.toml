[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-control"
version = "2.0.0"
description = "Quadrupedal robot control using MPC and Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["robotics", "mpc", "reinforcement-learning", "quadruped", "pybullet"]

dependencies = [
    "pybullet>=3.2.6",
    "gymnasium>=0.29.1",
    "stable-baselines3[extra]>=2.4.0",
    "torch>=2.1.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "tensorboard>=2.15.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "ipython>=8.12.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
